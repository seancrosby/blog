<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Sean Crosby's Blog</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <nav>
            <a href="index.html">← Back to Home</a> | 
            <a href="tags.html">All Tags</a>
        </nav>
    </header>
    <article>
        <h1>{{ title }}</h1>
        <div class="meta">
            <span>Published on {{ date }}</span>
            {% if tags %}
            <span class="post-tags">
                {% for tag in tags %}
                <a href="tags.html#{{ tag }}">#{{ tag }}</a>
                {% endfor %}
            </span>
            {% endif %}
        </div>
        <div class="content">
            {{ content }}
        </div>
    </article>
</body>
</html>
