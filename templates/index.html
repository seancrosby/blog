{% extends "base.html" %}

{% block content %}
    {% for post in posts %}
    <article class="post-preview">
        <h2><a href="{{ post.slug }}">{{ post.title }}</a></h2>
        <div class="meta">
            <span>{{ post.date }}</span>
            {% if post.tags %}
            <span class="post-tags-mini">
                {% for tag in post.tags %}
                <a href="tags.html#{{ tag }}">#{{ tag }}</a>
                {% endfor %}
            </span>
            {% endif %}
        </div>
        <div class="content">
            {{ post.content }}
        </div>
        <hr style="margin: 60px 0; border: 0; border-top: 1px solid #eee;">
    </article>
    {% endfor %}
{% endblock %}
