<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sean Crosby's Blog</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header>
        <h1>Sean Crosby's Blog</h1>
    </header>
    <main>
        <ul class="post-list">
            {% for post in posts %}
            <li>
                <span class="post-date">{{ post.date }}</span>
                <a href="{{ post.slug }}">{{ post.title }}</a>
            </li>
            {% endfor %}
        </ul>
    </main>
</body>
</html>
