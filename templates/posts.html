{% extends "base.html" %}

{% block title %}All Posts - {% endblock %}

{% block content %}
    <h1>All Posts</h1>
    <ul class="post-list">
        {% for post in posts %}
        <li>
            <span class="post-date">{{ post.date }}</span>
            <a href="{{ post.slug }}">{{ post.title }}</a>
            {% if post.tags %}
            <span class="post-tags-mini">
                {% for tag in post.tags %}
                <a href="tags.html#{{ tag }}">#{{ tag }}</a>
                {% endfor %}
            </span>
            {% endif %}
        </li>
        {% endfor %}
    </ul>
{% endblock %}
